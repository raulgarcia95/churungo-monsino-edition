<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Street Fighter II: Churungo Monsino Edition</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #09090d; color: #fff; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 0%, #56131b, #09090d 55%); }
    main { width: min(100%, 960px); padding: 24px; box-sizing: border-box; text-align: center; }
    h1 { margin: 0 0 6px; color: #ffd53d; font-size: clamp(1.5rem, 4vw, 2.5rem); text-shadow: 2px 2px #8f1010; }
    p { color: #e6d8ce; margin: 0 0 20px; }
    #game { width: 100%; aspect-ratio: 4 / 3; background: #000; box-shadow: 0 15px 50px #000; }
  </style>
</head>
<body>
  <main>
    <h1>Street Fighter II: Churungo Monsino Edition</h1>
    <p>Pulsa dentro del juego para empezar. Compatible con teclado y mandos.</p>
    <div id="game"></div>
  </main>
  <script>
    window.EJS_player = '#game';
    window.EJS_core = 'snes9x';
    window.EJS_gameUrl = 'Street Fighter II - Churungo Monsino edition.sfc';
window.EJS_gameParentUrl = 'churungo-msu-assets.zip';
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_language = 'es-ES';
    window.EJS_volume = 0.8;
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
